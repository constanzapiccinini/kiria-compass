<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Brand blue, so the mobile browser chrome above the app is KIRIA's rather than the
      platform's default. Phase 9 §2.
    -->
    <meta name="theme-color" content="#004AAD" />
    <!--
      The brand K, cropped from the wordmark by scripts/build-brand-logos.mjs and set
      white on --kiria-blue. A PNG rather than the wordmark itself: the wordmark is
      2.2:1 and an illegible smear at tab size.
    -->
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <!--
      Preload the one face, §1. `crossorigin` is required even same-origin: a font is
      fetched in CORS mode, and without it the browser downloads the file twice — once
      for the preload it then discards, once for the @font-face.
    -->
    <link
      rel="preload"
      href="/fonts/nunito-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Compass Insights</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
